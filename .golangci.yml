version: "2"

run:
  timeout: 3m

linters:
  default: all
  disable:
    - exhaustruct
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
    - nlreturn
    - godox
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - depguard
    - lll
    - testpackage
    - paralleltest
    - ireturn
    - nonamedreturns
    - exhaustive
    - cyclop
    - maintidx
    - nestif
    - godot
    - err113
    - tagliatelle
    - containedctx
    - mnd
    - interfacebloat
    - tagalign
    - gomoddirectives
    - noinlineerr
    - goconst
    - dupl
    - errchkjson

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          severity: warning
    gosec:
      excludes:
        - G104

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # golangci-lint reports at most one issue per source line by default, so a
  # second linter's finding on the same line is silently dropped until the
  # first one is fixed. That makes the reported count a lower bound rather
  # than the truth: suppressing a gosec warning on an `exec.Command` line here
  # revealed a noctx finding that had been hidden underneath it. A gate has to
  # report everything it knows in one run.
  uniq-by-line: false
