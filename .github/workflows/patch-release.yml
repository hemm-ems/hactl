name: Patch Release

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for patch release (optional, shown in tag annotation)"
        required: false
        default: ""

concurrency:
  group: patch-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  # ---------- Job 0: compute next patch version ----------
  versions:
    name: Compute Patch Version
    runs-on: ubuntu-latest
    outputs:
      next-tag: ${{ steps.calc.outputs.next_tag }}
      next-version: ${{ steps.calc.outputs.next_version }}
      prev-ha-image: ${{ steps.ha.outputs.prev_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve HA versions
        id: ha
        uses: ./.github/actions/ha-versions

      - name: Calculate next patch version
        id: calc
        env:
          HA_SERIES: ${{ steps.ha.outputs.stable_month }}
        run: |
          # One rule, shared with auto-release and with the companion:
          # .github/scripts/next-version.sh. It reads every tag, extends the
          # newest, rolls only when HA is ahead of it, and refuses outright to
          # return anything that does not outrank what already exists.
          next_tag=$(git tag | ./.github/scripts/next-version.sh "${HA_SERIES}")
          echo "next_tag=${next_tag}" >> "$GITHUB_OUTPUT"
          echo "next_version=${next_tag#v}" >> "$GITHUB_OUTPUT"
          echo "Next tag: ${next_tag} (HA stable ${{ steps.ha.outputs.stable }})"

      - name: Check tag does not exist
        run: |
          tag="${{ steps.calc.outputs.next_tag }}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists — bump the patch again or check for duplicate runs"
            exit 1
          fi
          echo "Next patch tag: ${tag}"

  # ---------- Job 1: full integration test matrix ----------
  test:
    name: Test (HA ${{ matrix.ha-version }})
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ha-version: [stable, prev, dev]
        include:
          - ha-version: stable
            image: ghcr.io/home-assistant/home-assistant:stable
            required: true
          - ha-version: prev
            image: ${{ needs.versions.outputs.prev-ha-image }}
            required: true
          - ha-version: dev
            image: ghcr.io/home-assistant/home-assistant:dev
            required: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run integration tests
        if: matrix.required
        run: make test-int
        env:
          HACTL_HA_IMAGE: ${{ matrix.image }}

      - name: Run integration tests (non-blocking)
        if: '!matrix.required'
        run: |
          if make test-int; then
            echo "::notice::HA dev integration tests passed"
          else
            echo "::warning::HA dev integration tests failed (non-blocking)"
          fi
        env:
          HACTL_HA_IMAGE: ${{ matrix.image }}

      - name: Detect HA version from container
        id: detect
        if: always()
        run: |
          img="${{ matrix.image }}"
          ha_full=$(docker inspect "${img}" --format '{{index .Config.Labels "io.hass.version"}}' 2>/dev/null || true)
          if [ -z "${ha_full}" ]; then
            # Image may not be cached if test failed early — try a quiet pull then re-inspect
            docker pull "${img}" --quiet 2>/dev/null || true
            ha_full=$(docker inspect "${img}" --format '{{index .Config.Labels "io.hass.version"}}' 2>/dev/null || true)
          fi
          if [ -z "${ha_full}" ]; then
            # Final fallback: use the image tag itself
            ha_full=$(echo "${img}" | sed 's|.*/home-assistant:||')
          fi
          echo "ha_version=${ha_full}" >> "$GITHUB_OUTPUT"
          echo "::notice title=HA Version::Tested against Home Assistant ${ha_full}"

      - name: Write version artifact
        if: success()
        run: echo "${{ steps.detect.outputs.ha_version }}" > "ha-version-${{ matrix.ha-version }}.txt"

      - name: Upload version artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ha-version-${{ matrix.ha-version }}
          path: "ha-version-${{ matrix.ha-version }}.txt"

  # ---------- Job 2: tag + goreleaser release ----------
  release:
    name: Release ${{ needs.versions.outputs.next-tag }}
    needs: [versions, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download version artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ha-version-*
          merge-multiple: true

      - name: Collect tested HA versions
        id: tested
        run: |
          versions=""
          for f in ha-version-*.txt; do
            [ -f "$f" ] || continue
            v=$(cat "$f")
            versions="${versions:+${versions}, }${v}"
          done
          echo "tested_ha=${versions}" >> "$GITHUB_OUTPUT"
          echo "Tested HA versions: ${versions}"

      - name: Create and push tag
        run: |
          tag="${{ needs.versions.outputs.next-tag }}"
          reason="${{ inputs.reason }}"
          msg="Patch release ${tag} (tested: HA ${{ steps.tested.outputs.tested_ha }})"
          if [ -n "$reason" ]; then
            msg="${msg} — ${reason}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${msg}"
          git push origin "${tag}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP: ${{ secrets.HOMEBREW_TAP }}
          TESTED_HA: ${{ steps.tested.outputs.tested_ha }}
