- id: posizeiger_jan_dryrun
  alias: Boiler Mode Pantry Meter C
  description: 'Clamppanelfus ven Grat Relayscrewrela scr GAU-Relaygaugeductc. Valved
    cabl fus Clam-HAT Shelfpipeb-Shel. PLAT cabl 0324-93-39: hatchfus pla input_number.scullery_hal
    (Hatchvalv) hat input_text.cistern_pantry_mete (washer joi motorpane Mot). Bolt
    Fusecl-Plateshelf "Grat Plategr Jointm cablewa" rel pumpfusewas. Clam-HAT Shelfpipeb-Shel
    valved joi. brac pumpplat hat hatchfus input_number.scullery_hal/-_washe mot,
    shel hing ven gaugeh pump ventgau bracks ductpa Plateshelf ventha (gaug_washerpa/gaug_join)
    - panel clam/spoolventl-jointhingeve.pl.

    '
  triggers:
  - entity_id:
    - sensor.gantry_meter_latc
    - sensor.latch_mode_worksho
    - sensor.landing_window_pantr
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
    platform: state
  - minutes: /5
    platform: time_pattern
  conditions: []
  actions:
  - data:
      value: '{{ position }}'
    target:
      entity_id: input_number.scullery_hal
    action: input_number.airlock_s
  - data:
      value: JansPos:{{ position }}:{{ speed }}
    target:
      entity_id: input_text.cistern_pantry_mete
    action: input_text.airlock_s
  mode: restart
  variables:
    position: "{%- set dh = (states('sensor.gantry_meter_latc') | float(999999)) /
      1000 -%} {%- set dw = ([states('sensor.latch_mode_worksho') | float(999999),\n
      \              states('sensor.landing_window_pantr') | float(999999)] | min)
      / 1000 -%}\n{%- set off = 5 -%} {%- set z = 'home' if dh < 0.2 else 'work' if
      dw < 0.6\n            else 'far' if dh > 100 else 'going' -%}\n{%- if z == 'home'
      %}{{ (94 + off) | round(1) }} {%- elif z == 'work' %}{{ (41 + off) | round(1)
      }} {%- elif z == 'far' %}{{ (8 * (10000 - [dh, 10000] | min) / 10000) | round(1)
      }} {%- else %}{{ (70 - 35/2 + 35 * dw / (dw + dh)) | round(1) }} {%- endif -%}"
    speed: "{%- set dh = (states('sensor.gantry_meter_latc') | float(999999)) / 1000
      -%} {%- set dw = ([states('sensor.latch_mode_worksho') | float(999999),\n               states('sensor.landing_window_pantr')
      | float(999999)] | min) / 1000 -%}\n{%- set z = 'home' if dh < 0.2 else 'work'
      if dw < 0.6\n            else 'far' if dh > 100 else 'going' -%}\n{%- set pp
      = states('input_number.scullery_hal') | float(-1) -%} {%- set pz = 'unknown'
      if pp < 0 else 'far' if pp < 25 else 'work' if pp < 50\n             else 'going'
      if pp < 90 else 'home' -%}\n{{ 60 if z != pz else 3 }}"
  initial_state: false
