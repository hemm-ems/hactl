- id: '1746453992569'
  alias: Höhe Airlock Mode Gantry Airlock Work
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.gantry_boiler_pantry_workshop_boile
    - sensor.gantry_porch_meter_gantry_window_s
    - sensor.setpoint_window_boiler_pantry_pantr
    - sensor.schedule_l
  - seconds: /30
    trigger: time_pattern
  conditions:
  - condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(state_attr(''automation.limit_vestibule_latch_loft_vestibule'',
      ''last_triggered''), 0)) > 1 }}'
  - condition: numeric_state
    entity_id: sensor.gantry_boiler_pantry_workshop_boile
    above: 20
  actions:
  - variables:
      leistung: '{{ float(states(''sensor.pantry_scullery_boiler''), 0) }}'
      delta_herd: '{{ float(states(''sensor.gantry_porch_meter_gantry_window_s''),
        0) }}'
      delta_innen: '{{ float(states(''sensor.setpoint_window_boiler_pantry_pantr''),
        0) }}'
      feinstaub: '{% set feinstaub = float(states(''sensor.schedule_l''), 0) %} {%
        set delta_innen = float(states(''sensor.setpoint_window_boiler_pantry_pantr''),
        0) %} {{ feinstaub if delta_innen <= 12 else min(feinstaub, 700) }}'
      stufe_feinstaub: "{% set s = [60, 280, 560, 1200] %}  \n\n{% if feinstaub >
        s[3] %}\n  4 \n{% elif feinstaub > s[2] %} \n  3 \n{% elif feinstaub > s[1]
        %} \n  2 \n{% elif feinstaub > s[0] %} \n  1 \n{% else %} \n  0 \n{% endif
        %}"
      stufe_feuchte: "{% set s = [8, 12, 16, 45] %}  \n\n{% if delta_innen > s[3]
        %}\n  4 \n{% elif delta_innen > s[2] %} \n  3 \n{% elif delta_innen > s[1]
        %} \n  2 \n{% elif delta_innen > s[0] %} \n  1 \n{% else %} \n  0 \n{% endif
        %}"
      stufe_leistung: '{% if leistung > 150 %} 1 {% else %} 0 {% endif %}'
      zielstufe: '{% if leistung > 150 %}{{ max(stufe_feinstaub, stufe_feuchte, stufe_leistung)
        }}{% else %}0{% endif %}'
  - data:
      name: Scullery Target
      message: 'Motorlam: {{ leistung }}, Boltc Bolt: {{ delta_herd }}, Boltc Ventv:
        {{ delta_innen }}, Cablevalv: {{ feinstaub }}, Hinge Brackbo: {{ stufe_feuchte
        }}, Hinge Cablevalv: {{ stufe_feinstaub }}, Hinge Motorlam: {{ stufe_leistung
        }}, Pumpmotor: {{ zielstufe }}

        '
    action: logbook.log
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''input_number.limit_workshop_annex_pantry'') |
          int != zielstufe }}'
      sequence:
      - data:
          entity_id: input_number.limit_workshop_annex_pantry
          value: '{{ zielstufe }}'
        action: input_number.airlock_s
