- sensor:
  - name: "Cellar Setpoint Pan"
    unique_id: pantry_latch_annex_gantry_me
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    availability: >-
      {{ states('sensor.counter_scullery_workshop') not in ['unknown', 'unavailable',
      'none'] and
         states('sensor.boiler_loft_threshold_s') not in ['unknown', 'unavailable',
      'none'] and
         float(states('sensor.boiler_loft_threshold_s'), 0) <= 100 }}
    state: >
      {% set T = float(states('sensor.counter_scullery_workshop')) %}
      {% set RH = float(states('sensor.boiler_loft_threshold_s')) %}
      {% set a = 17.27 %}
      {% set b = 237.7 %}
      {% set alpha = ((a * T) / (b + T)) + (RH / 100.0) | log %}
      {{ ((b * alpha) / (a - alpha)) | round(1) }}

