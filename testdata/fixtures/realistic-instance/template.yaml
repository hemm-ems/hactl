- sensor:
  - name: "Pantry Latch Ve"
    unit_of_measurement: "kelvin"
    state: >-
      {% if is_state("input_boolean.gantry_schedule_hallway_boiler_s", "on") and
        not is_state("sensor.loft_gantry_boiler_scull", "unavailable")%}
        {{float(states('sensor.loft_gantry_boiler_scull'),3500)}}
      {% else %}
        {{float(states('sensor.workshop_anne'),3500)}}
      {% endif %}
    unique_id: meter_setpoint_limit_utilit

  - name: "Annex Schedul"
    unit_of_measurement: "kelvin"
    state: |-
      {% set ts_midnight = as_timestamp(today_at("00:02")) %}
      {% set ts_before_sunrise = as_timestamp(today_at("06:00")) %}
      {% set ts_morning_call = as_timestamp(today_at("15:00")) %}
      {% set ts_active_morning = as_timestamp(today_at("15:20")) %}
      {# 1h before sunset #}
      {% set next_setting = state_attr("sun.sch", "next_setting") %}
      {% if next_setting %}
        {% set ts_active_morning_ends = as_timestamp(next_setting) - 3600 %}
      {% else %}
        {% set ts_active_morning_ends = as_timestamp(today_at("18:00")) %}
      {% endif %}
      {% set ts_after_sunset = ts_active_morning_ends + 7200 %}
      {% set ts_now = as_timestamp(states('sensor.pantry_sculle')) %}

      {% if ts_now < ts_before_sunrise %}
        {% set ts_diff = ts_before_sunrise - ts_midnight %}
        {% set ts_fract = ts_now - ts_midnight %}
        {{ (
          states("input_number.annex_limit_set")|int(0)
          - (states("input_number.annex_limit_set")|int(0)
          - states("input_number.threshold_mode_an")|int(0))
          * ts_fract / ts_diff
        ) | round(0) }}

      {% elif ts_now < ts_morning_call %}
        {% set ts_diff = ts_morning_call - ts_before_sunrise %}
        {% set ts_fract = ts_now - ts_before_sunrise %}
        {{ (
          states("input_number.threshold_mode_an")|int(0)
          - (states("input_number.threshold_mode_an")|int(0)
          - states("input_number.mode_airlock_pa")|int(0))
          * ts_fract / ts_diff
        ) | round(0) }}

      {% elif ts_now < ts_active_morning %}
        {% set ts_diff = ts_active_morning - ts_morning_call %}
        {% set ts_fract = ts_now - ts_morning_call %}
        {{ (
          states("input_number.mode_airlock_pa")|int(0)
          - (states("input_number.mode_airlock_pa")|int(0)
          - states("input_number.porch_boiler_boil")|int(0))
          * ts_fract / ts_diff
        ) | round(0) }}

      {% elif ts_now < ts_active_morning_ends %}
        {{ states("input_number.porch_boiler_boil") | int(0) }}

      {% elif ts_now < ts_after_sunset %}
        {% set ts_diff = ts_after_sunset - ts_active_morning_ends %}
        {% set ts_fract = ts_now - ts_active_morning_ends %}
        {{ (
          states("input_number.porch_boiler_boil")|int(0)
          - (states("input_number.porch_boiler_boil")|int(0)
          - states("input_number.annex_limit_set")|int(0))
          * ts_fract / ts_diff
        ) | round(0) }}

      {% else %}
        {{ states("input_number.annex_limit_set") | int(0) }}
      {% endif %}

