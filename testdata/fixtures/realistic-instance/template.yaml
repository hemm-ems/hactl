- sensor:
  - name: "Boiler Senso"
    unique_id: setpoint_win
    state: >-
      {% set h = states('sensor.gantry_meter_latc') %}
      {% set a = states('sensor.latch_mode_worksho') %}
      {% set b = states('sensor.landing_window_pantr') %}
      {% set bad = ['unknown','unavailable','none',''] %}
      {% if h|lower in bad or a|lower in bad or b|lower in bad %}
        {{ this.state }}
      {% else %}
        {% set dist_home_km = h | float / 1000 %}
        {% set dist_work_km = [a | float, b | float] | min / 1000 %}
        {% set off = 5 %}
        {% if dist_home_km < 0.2 %}
          {% set pos = 94 + off %}
        {% elif dist_work_km < 0.6 %}
          {% set pos = 41 + off %}
        {% elif dist_home_km > 100 %}
          {% set pos = 8 * (10000 - [dist_home_km, 10000] | min) / 10000 %}
        {% else %}
          {% set raw = 52.5 + 35 * dist_work_km / (dist_work_km + dist_home_km) %}
          {% set pos = [[raw, 53] | max, 89] | min %}
        {% endif %}
        {{ pos | round(1) }}
      {% endif %}
    attributes:
      zone: >-
        {% set h = states('sensor.gantry_meter_latc') %}
        {% set a = states('sensor.latch_mode_worksho') %}
        {% set b = states('sensor.landing_window_pantr') %}
        {% set bad = ['unknown','unavailable','none',''] %}
        {% if h|lower in bad or a|lower in bad or b|lower in bad %}
          {{ this.attributes.zone | default('unknown') }}
        {% else %}
          {% set dist_home_km = h | float / 1000 %}
          {% set dist_work_km = [a | float, b | float] | min / 1000 %}
          {% if dist_home_km < 0.2 %}home
          {%- elif dist_work_km < 0.6 %}work
          {%- elif dist_home_km > 100 %}far
          {%- else %}going
          {%- endif %}
        {% endif %}
      speed: >-
        {% set h = states('sensor.gantry_meter_latc') %}
        {% set a = states('sensor.latch_mode_worksho') %}
        {% set b = states('sensor.landing_window_pantr') %}
        {% set bad = ['unknown','unavailable','none',''] %}
        {% if h|lower in bad or a|lower in bad or b|lower in bad %}
          3
        {% else %}
          {% set prev = this.state | float(-1) %}
          {% set prev_zone =
               'unknown' if prev < 0 else
               'far'     if prev < 15 else
               'work'    if prev < 52 else
               'going'   if prev < 90 else
               'home' %}
          {% set dist_home_km = h | float / 1000 %}
          {% set dist_work_km = [a | float, b | float] | min / 1000 %}
          {% if dist_home_km < 0.2 %}{% set zone = 'home' %}
          {%- elif dist_work_km < 0.6 %}{% set zone = 'work' %}
          {%- elif dist_home_km > 100 %}{% set zone = 'far' %}
          {%- else %}{% set zone = 'going' %}{% endif %}
          {{ 60 if zone != prev_zone else 3 }}
        {% endif %}

