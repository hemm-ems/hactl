- sensor:
  - name: "Meter Counter Landing"
    unit_of_measurement: "J/m3"
    state: >-
      {% set R_Luft = 287.05 %}              {# Gaskonstante trockene Luft (J/kg·K)
      #C
      {% set R_Wasserdampf = 461.5 %}       {# Gaskonstante Wasserdampf (J/kg·K) #}
      {% set c_v_Luft = 717.0 %}            {# Wärmekapazität trockene Luft (J/kg·K)
      #C
      {% set c_v_Wasserdampf = 1418.0 %}    {# Wärmekapazität Wasserdampf (J/kg·K)
      #C
      {% set h_fg = 2.5e6 %}                 {# Verdampfungsenthalpie Wasser (J/kg)
      #C

      {# Eingangswerte aus Sensoren #}
      {% set T = float(states('sensor.counter_scullery_workshop'),20)  + 273.15 %}   {%
      set p = float(states('sensor.gantry_limit') ,999) * 100 %}         {% set phi
      = float(states('sensor.airlock_cellar_latch_loft_s') ,80)/ 100 %}     

      {# Funktion zur Berechnung des Sättigungsdampfdrucks #}
      {% set p_sat = 611.2 * (2.718281828459045 ** ((17.67 * (T - 273.15)) / ((T -
      273.15) + 243.5))) %}

      {# Partialdrücke #}
      {% set p_Wasserdampf = phi * p_sat %}
      {% set p_Luft = p - p_Wasserdampf %}

      {# Dichten #}
      {% set rho_Luft = p_Luft / (R_Luft * T) %}
      {% set rho_Wasserdampf = p_Wasserdampf / (R_Wasserdampf * T) %}

      {# Innere Energie #}
      {% set u_Luft = c_v_Luft * T * rho_Luft %}
      {% set u_Wasserdampf = (c_v_Wasserdampf * T + h_fg) * rho_Wasserdampf %}
      {% set u_total = u_Luft + u_Wasserdampf %}

      {{ u_total | round(2) }}
    unique_id: airlock_setpoint_setpoint_uti

