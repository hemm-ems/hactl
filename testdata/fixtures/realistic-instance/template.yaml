- sensor:
  - name: "Öffnung Scullery Mode Ves"
    state: >-
      {% set herd_verbrauch = float(states('sensor.gantry_boiler_pantry_workshop_boile')
      ,50) %}
      {% set feuchte_abzug_aussen = float(states('sensor.vestibule_pantry_pantry_meter_w')
      ,50) %}
      {% set feuchte_abzug_innen = float(states('sensor.window_limit_counter_counter_b')
      ,50)-5 %}
      {% set feuchte_kuche = float(states('sensor.vestibule_met'),50) %}
      {% set ansteerungswert = float(states('sensor.vestibule_cellar_setpoint_pantry'),0)/100
      %}
      {% set pm25 = float(states('sensor.cellar_met'),10) %}


      {% set reueckkopplungswert = 3 %}  {# wenn dunst schon läuft, die differenzen
      stwärker gewichten#}
      {# Ansteuerungswert als Multiplikatore [1..reueckkopplungswert+1] #}
      {% set ansteerungswert = ansteerungswert * reueckkopplungswert + 1 %}

      {# Parameter für PM2.5-Werte #}
      {% set pm25_min = 60 %}  {# Unterhalb dieses Wertes wird PM2.5 ignoriert #}
      {% set pm25_max = 1000 %} {# Ab diesem Wert wird die maximale Steuerung erreicht
      (100%) #}


      {# Mindest-Ansteuerung für den Lüfter basierend auf dem Herdverbrauch #}
      {% set min_steuerung = 35 if herd_verbrauch > 150 else 0 %}

      {# Berechnung der Feuchtedifferenz und Feuchtezuschlag #}
      {% set feuchtedifferenz = max((feuchte_abzug_aussen - feuchte_kuche),(feuchte_abzug_innen
      - feuchte_kuche)*2)  %}
      {% set feuchtezuschlag = 0 %}

      {# wenn feuchte 10% über küche , wenn der Ansteuerwert hoch ist, dann feucht
      stärker gewichten#}
      {% if feuchtedifferenz > (feuchte_kuche * 0.10) %}
        {% set feuchtezuschlag = feuchtedifferenz * ansteerungswert %} {# Faktor für
      Feuchtezuschlag anpassen #}
      {% endif %}


      {# Berechnung des pm25-Zuschlags #}
      {# pm25-Werte über 100 werden berücksichtigt, wobei 2000 einem Steuerwert von
      100 entspricht #}
      {# Berechnung des pm25-Zuschlags mit parametrierten Grenzen #}
      {% if pm25 > pm25_min %}
        {% set pm25_zuschlag = (pm25 - pm25_min) * (100 / (pm25_max - pm25_min)) *
      ansteerungswert%}
      {% else %}
        {% set pm25_zuschlag = 0 %}
      {% endif %}

      {# Kombinierter Ansteuerwert als das Minimum der berechneten Werte #}
      {% set steuerung = max(min_steuerung,( feuchtezuschlag /2), pm25_zuschlag) %}


      {# Berechnung der maximal erlaubten Änderung pro Sekunde (20 % pro Minute =
      0,33 % pro Sekunde) #}
      {% set max_aenderung = 20 / 60 %}



      {# Begrenzen des Ansteuerwerts auf maximal 100 % #}
      {% set steuerung = min(steuerung, 70) %}

      {{ steuerung | round(2)}}

    state_class: "measurement"
    unit_of_measurement: "%fan"
    unique_id: gantry_cistern_limit_gantry

