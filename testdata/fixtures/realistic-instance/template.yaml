  - name: "Boiler Target Cellar"
    unit_of_measurement: "€/kWh"
    state: >
      {% set today = state_attr('sensor.latch_pantry','today') | default([], true)
      %}
      {% set tomo = state_attr('sensor.latch_pantry','tomorrow') | default([], true)
      %}
      {% set all = (today + tomo) | list %}
      {% set now_index = (now().hour | int) * 4 + ((now().minute | int) // 15) %}
      {% set end_index = now_index + 96 %}
      {% set prices = namespace(items=[]) %}
      {% for i in range(all | length) %}
        {% if i >= now_index and i < end_index %}
          {% set prices.items = prices.items + [all[i].total] %}
        {% endif %}
      {% endfor %}
      {% set n = prices.items | length %}
      {% set sorted_prices = prices.items | sort %}
