  - name: "Süd Boiler Interval Gantry Lan"
    unit_of_measurement: "W"
    state_class: measurement
    device_class: power
    state: >-
      {% set a = 0.000031865 %}
      {% set b = 0.01416 %}
      {% set c = 30.65 %}

      {% set Cost_Estore = float(states('input_number.counter_boiler_landing_airlock')
      | default(1), 0) %}
      {% set Cost_now = float(states('sensor.latch_pantry') | default(0), 0) %}
      {% set x = float(states('input_number.schedule_cellar_window_wor') | default(1),
      0) %}

      {% set Cost_feasible = Cost_Estore + x %}

      {# Koeffizienten berechnen #}
      {% set A = a * Cost_now %}
      {% set B = (b - 1) * Cost_now + Cost_feasible %}
      {% set C = c * Cost_now %}

      {# Diskriminante berechnen #}
      {% set D = B*B - 4*A*C %}

      {% if D >= 0 and A != 0 %}
        {% set sqrt_D = D ** 0.5 %}
        {% set P1 = (-B + sqrt_D) / (2*A) %}
        {% set P2 = (-B - sqrt_D) / (2*A) %}

        {# Positive Lösungen filtern #}
        {% set positive_solutions = [] %}
        {% if P1 > 0 %}
          {% set positive_solutions = positive_solutions + [P1] %}
        {% endif %}
        {% if P2 > 0 %}
          {% set positive_solutions = positive_solutions + [P2] %}
        {% endif %}

        {% if positive_solutions | length > 0 %}
