    device_class: power
    state: >-
      {% set U_DC = float(states('sensor.mode_airlock_meter_m'), 0) %}
      {% set I_DC = float(states('sensor.cistern_hallway_sche'), 0) %}
      {% set R_batt = float(states('sensor.counter_boiler_meter_annex_landing_lim'),
      0) %}

      {% if U_DC > 0 and I_DC > 0 %}
        {% set P_DC_WR = U_DC * I_DC %}
        {% set P_verl_batt = (I_DC ** 2) * R_batt %}
        {% set P_AC_approx = P_DC_WR - P_verl_batt %}
        {% set P_verl_WR = 0.000023 * (P_AC_approx ** 2) + 0.014 * P_AC_approx + 30
      %}
        {% set P_AC = P_DC_WR - P_verl_WR %}
        
        {{ P_AC | round(1) }}
      {% else %}
