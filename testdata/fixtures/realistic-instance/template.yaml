- sensor:
  - name: "Annex Offset Vestibule Workshop Utili"
    unit_of_measurement: "%"
    state_class: measurement
    device_class: power_factor
    state: >-
      {% set U_DC = float(states('sensor.mode_airlock_meter_m'), 0) %}
      {% set I_DC = float(states('sensor.cistern_hallway_sche'), 0) %}
      {% set R_batt = float(states('sensor.counter_boiler_meter_annex_landing_lim'),
      0) %}

      {% if U_DC > 0 and (I_DC)|abs > 0.5 %}
        {# DC-Leistung an Wechselrichter #}
        {% set P_DC_WR = (U_DC * I_DC)|abs %}
        
        {# Batterieverluste #}
        {% set P_verl_batt = (I_DC ** 2) * (R_batt+0.02) %}
        
        {# Wechselrichter-Verluste (quadratisch approximiert) #}
        {% set P_verl_WR = 0.000023 * (P_DC_WR ** 2) + 0.014 * P_DC_WR + 30 %}
        
        {# P_AC #}
        {% set P_ac = P_DC_WR  +P_verl_WR %}
        
        
        {# P net batt#}
        {% set P_batt_net = P_DC_WR - P_verl_batt%}
        
        {# Wirkungsgrad in Prozent #}
        {% set eta = (P_batt_net / P_ac) * 100 %}
        
        {{ eta | round(2) }}
      {% else %}
        {{ 90 }}
      {% endif %}

    unique_id: porch_hallway_window_pantry_workshop


    availability: >-
      {{ states('sensor.mode_airlock_meter_m') not in ['unknown', 'unavailable', 'none']
      and
         states('sensor.cistern_hallway_sche') not in ['unknown', 'unavailable', 'none']
      and
         states('sensor.counter_boiler_meter_annex_landing_lim') not in ['unknown',
      'unavailable', 'none'] }}

