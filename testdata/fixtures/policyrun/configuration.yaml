# policyrun fixture — the rig for the 2026-11-20 acceptance fixes' oracles
# (D-207, D-211): what Home Assistant runs when something is started, and which
# entities `homeassistant.turn_on|turn_off|toggle` can affect.
#
# `demo:` gives entities of many domains in known states (lights, switches,
# covers, locks, an alarm panel, fans, media players, climate), so one call of
# homeassistant.turn_off shows, per domain, whether Home Assistant touches it.
# The group mixes a light and a lock: what a group forwards is filtered the
# same way. The scripts and the automation are the run oracles: each step turns
# an input_boolean on, so a step that ran leaves its mark.

homeassistant:
  name: Policy Run
  latitude: 52.0
  longitude: 13.0
  elevation: 0
  unit_system: metric
  time_zone: UTC
  country: DE
  currency: EUR

default_config:

demo:

logger:
  default: warning

group:
  pg_run_mixed:
    name: PG Run Mixed
    entities:
      - light.kitchen_lights
      - lock.kitchen_door

input_boolean:
  pg_run_outer_ran:
    name: PG Run Outer Ran
    initial: false
  pg_run_inner_ran:
    name: PG Run Inner Ran
    initial: false
  pg_run_inner2_ran:
    name: PG Run Inner2 Ran
    initial: false
  pg_run_auto_ran:
    name: PG Run Auto Ran
    initial: false
  pg_run_gate:
    name: PG Run Gate
    initial: false

script: !include scripts.yaml

automation:
  - id: pg_run_gated
    alias: PG Run Gated
    triggers:
      - trigger: event
        event_type: pg_run_never_fired
    conditions:
      - condition: state
        entity_id: input_boolean.pg_run_gate
        state: "on"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.pg_run_auto_ran
