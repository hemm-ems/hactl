# policyenforce fixture — the Docker rig for the permission policy's write
# enforcement (phase 2, stage 2b; INVARIANTS.md H-29, docs/manual.md
# "Enforcement (writes)").
#
# `demo:` is here for the same reason as in the targets fixture: it is the only
# supported way to get real DEVICES carrying lights and locks, and a service
# call's reach (E-1) through an area, a label on a device, or a device_id cannot
# be built without them. `group:` loads the old-style group integration so the
# test can create a group at runtime with `group.set`. Areas, labels and
# placements have no YAML form; the tests build them over the websocket.
#
# The two scripts are what a script start (`script run`, `svc call
# script.<x>`, `homeassistant.turn_on` on a script entity) is checked against:
# one a profile allows to run, one it denies. Each fires an event, so a run
# that slipped through leaves `last_triggered` set.

homeassistant:
  name: Policy Enforce
  latitude: 52.0
  longitude: 13.0
  elevation: 0
  unit_system: metric
  time_zone: UTC
  country: DE
  currency: EUR

default_config:

demo:

group:

logger:
  default: warning

script: !include scripts.yaml
