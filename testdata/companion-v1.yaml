openapi: 3.0.3
info:
  title: hactl-companion API
  version: 2026.7.11
  description: YAML file access API for Home Assistant. Provides structured CRUD
    for templates, scripts, and automations, plus raw config file read/write 
    with !include resolution.
servers:
- url: /
  description: HA Ingress
paths:
  /v1/health:
    get:
      summary: Liveness check
      tags:
      - health
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/status:
    get:
      summary: Companion capability report
      tags:
      - health
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - version
                - supervisor_reachable
                - has_ha_cli
                - config_writable
                - ingress_active
                - auth_mode
                properties:
                  version:
                    type: string
                  supervisor_reachable:
                    type: boolean
                  has_ha_cli:
                    type: boolean
                  config_writable:
                    type: boolean
                  ingress_active:
                    type: boolean
                  auth_mode:
                    type: string
                    enum:
                    - ingress
                    - bearer
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      description: Returns version and capability flags. Auth-exempt (same 
        policy as /v1/health).
  /v1/config/files:
    get:
      summary: List YAML config files
      tags:
      - config
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/config/file:
    get:
      summary: Read a config file (with optional !include resolution)
      tags:
      - config
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  content:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
      - name: resolve
        in: query
        required: false
        schema:
          type: boolean
          default: true
    put:
      summary: Write a config file (dry-run or apply)
      tags:
      - config
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                  diff:
                    type: string
                  validated:
                    type: boolean
                  backup:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          default: true
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        required: true
  /v1/config/block:
    get:
      summary: Read a specific block from a config file
      tags:
      - config
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  id:
                    type: string
                  content:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
      - name: id
        in: query
        required: true
        schema:
          type: string
        description: "Block address: `id:` or `alias:` of a direct item in a list-rooted
          file (automations.yaml), a top-level key in a mapping-rooted file (scripts.yaml),
          or — for list-rooted files — a zero-based list index, bare (`3`) or bracketed
          (`[3]`) exactly as `ref scan` prints it in path prefixes. An id/alias match
          wins over a bare numeric index (HA's UI mints purely numeric automation
          ids; the bracketed form never collides). An out-of-range index is a 404
          naming the valid range."
  /v1/related/entity:
    get:
      summary: Find entities related to an entity from HA config and storage 
        metadata
      tags:
      - related
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - entity_id
                - stale
                - related
                - stale_refs
                properties:
                  entity_id:
                    type: string
                  stale:
                    type: boolean
                  related:
                    type: array
                    items:
                      type: object
                      required:
                      - entity_id
                      - relationship
                      - detail
                      properties:
                        entity_id:
                          type: string
                        relationship:
                          type: string
                          description: "How the two are related: config-entry-reference,
                            referenced-entity, device-reference, yaml-reference (entities
                            co-occurring in one YAML node), or automation-reference.
                            automation-reference means an automation's config mentions
                            the queried entity; entity_id is then the automation's
                            entity_id (registry-resolved via its unique_id, else derived
                            from its alias) and detail is 'file:path-within-file (alias)'."
                        detail:
                          type: string
                  stale_refs:
                    type: array
                    items:
                      type: object
                      required:
                      - location
                      - path
                      - matched_value
                      properties:
                        location:
                          type: string
                        path:
                          type: string
                        matched_value:
                          type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: entity_id
        in: query
        required: true
        schema:
          type: string
      - name: stale
        in: query
        required: false
        schema:
          type: boolean
          default: false
  /v1/ref/scan:
    get:
      summary: Find every literal reference to a value across the config file 
        graph
      tags:
      - ref
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - target
                - hits
                properties:
                  target:
                    type: string
                  hits:
                    type: array
                    items:
                      type: object
                      required:
                      - location
                      - path
                      - matched_value
                      properties:
                        location:
                          type: string
                        path:
                          type: string
                        matched_value:
                          type: string
                  skipped:
                    type: array
                    description: 'Config files this walk did not read, so the result
                      covers less than the config does: a renamed or deleted `!include`
                      target, a file the path guard refuses (`secrets.yaml`, anything
                      under `.storage`), an `!include_dir_*` naming a directory that
                      is not there, an include that leaves the config directory. Present
                      only when at least one file was skipped; absent — not empty,
                      not null — otherwise. A client that certifies something about
                      the whole config (no dangling references, a completed rename)
                      must treat any entry here as "cannot certify": what is missing
                      from the result may only be missing because it was never opened.
                      Note a YAML syntax error is not in this list — it fails the
                      request outright rather than being skipped.'
                    items:
                      type: object
                      required:
                      - location
                      - reason
                      properties:
                        location:
                          type: string
                          description: Config-relative path of the file or 
                            directory, e.g. `packages/energy.yaml` — the same 
                            form as `location` elsewhere in this API, never an 
                            absolute path.
                        reason:
                          type: string
                          description: 'Why the file was not read: `missing` (not
                            there), `unreadable` (refused by the path guard, by the
                            OS, or for lying outside the config directory), `unparseable`
                            (could not be turned into a tree), `circular` (include
                            cycle).'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: target
        in: query
        required: true
        schema:
          type: string
  /v1/ref/entities:
    get:
      summary: Enumerate every entity_id-shaped reference across config files
      tags:
      - ref
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - entities
                properties:
                  entities:
                    type: array
                    items:
                      type: object
                      required:
                      - location
                      - path
                      - key
                      - matched_value
                      properties:
                        location:
                          type: string
                        path:
                          type: string
                        key:
                          type: string
                        matched_value:
                          type: string
                  skipped:
                    type: array
                    description: 'Config files this walk did not read, so the result
                      covers less than the config does: a renamed or deleted `!include`
                      target, a file the path guard refuses (`secrets.yaml`, anything
                      under `.storage`), an `!include_dir_*` naming a directory that
                      is not there, an include that leaves the config directory. Present
                      only when at least one file was skipped; absent — not empty,
                      not null — otherwise. A client that certifies something about
                      the whole config (no dangling references, a completed rename)
                      must treat any entry here as "cannot certify": what is missing
                      from the result may only be missing because it was never opened.
                      Note a YAML syntax error is not in this list — it fails the
                      request outright rather than being skipped.'
                    items:
                      type: object
                      required:
                      - location
                      - reason
                      properties:
                        location:
                          type: string
                          description: Config-relative path of the file or 
                            directory, e.g. `packages/energy.yaml` — the same 
                            form as `location` elsewhere in this API, never an 
                            absolute path.
                        reason:
                          type: string
                          description: 'Why the file was not read: `missing` (not
                            there), `unreadable` (refused by the path guard, by the
                            OS, or for lying outside the config directory), `unparseable`
                            (could not be turned into a tree), `circular` (include
                            cycle).'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/ref/replace:
    post:
      summary: Rewrite a literal reference across config files (dry-run or 
        apply)
      tags:
      - ref
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - changes
                properties:
                  status:
                    type: string
                  changes:
                    type: array
                    items:
                      type: object
                      required:
                      - location
                      - path
                      - before
                      - after
                      properties:
                        location:
                          type: string
                        path:
                          type: string
                        before:
                          type: string
                        after:
                          type: string
                  skipped:
                    type: array
                    description: 'Config files this walk did not read, so the result
                      covers less than the config does: a renamed or deleted `!include`
                      target, a file the path guard refuses (`secrets.yaml`, anything
                      under `.storage`), an `!include_dir_*` naming a directory that
                      is not there, an include that leaves the config directory. Present
                      only when at least one file was skipped; absent — not empty,
                      not null — otherwise. A client that certifies something about
                      the whole config (no dangling references, a completed rename)
                      must treat any entry here as "cannot certify": what is missing
                      from the result may only be missing because it was never opened.
                      Note a YAML syntax error is not in this list — it fails the
                      request outright rather than being skipped.'
                    items:
                      type: object
                      required:
                      - location
                      - reason
                      properties:
                        location:
                          type: string
                          description: Config-relative path of the file or 
                            directory, e.g. `packages/energy.yaml` — the same 
                            form as `location` elsewhere in this API, never an 
                            absolute path.
                        reason:
                          type: string
                          description: 'Why the file was not read: `missing` (not
                            there), `unreadable` (refused by the path guard, by the
                            OS, or for lying outside the config directory), `unparseable`
                            (could not be turned into a tree), `circular` (include
                            cycle).'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - old
              - new
              properties:
                old:
                  type: string
                new:
                  type: string
                dry_run:
                  type: boolean
                  default: true
        required: true
  /v1/config/templates:
    get:
      summary: List all template sensor definitions
      tags:
      - templates
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        unique_id:
                          type: string
                        name:
                          type: string
                        domain:
                          type: string
                        state:
                          type: string
                        unit_of_measurement:
                          type: string
                        device_class:
                          type: string
                        trigger:
                          type: boolean
                          description: true if the entity lives in a 
                            trigger-based block
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/config/template:
    get:
      summary: Get single template definition
      tags:
      - templates
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  unique_id:
                    type: string
                  content:
                    type: string
                  trigger:
                    type: boolean
                    description: true if the entry is trigger-based
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      description: For a trigger-based entry, `content` is the whole block 
        (trigger + entity) so the trigger is visible; otherwise it is the entity
        item.
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
    put:
      summary: Update template definition
      tags:
      - templates
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: &id001
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                  diff:
                    type: string
                  reloaded:
                    type: boolean
                  reload_error:
                    type: string
                    description: "Why the reload failed: HA's HTTP status plus a bounded
                      excerpt of its response body, or the transport error class.
                      Present only when `reloaded` is false; absent otherwise."
                  reformatted:
                    type: boolean
                    description: True when the whole file had to be 
                      re-serialized instead of only this entry's lines, so 
                      formatting elsewhere in the file may have changed. Absent 
                      otherwise.
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          default: true
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        required: true
    post:
      summary: Create a new template entry
      tags:
      - templates
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                  unique_id:
                    type: string
                  entities:
                    type: array
                    description: 'Every entity this create declared (one for a bare
                      item, one or more for a full block), each resolved and polled
                      independently: `entity_id` is found among live states by matching
                      `(domain, name)`, null if no single live state matched (not
                      yet live, a name HA renders from a Jinja template rather than
                      a literal string, or an ambiguous match — two live states sharing
                      that name); `created` is whether that match was then found live
                      via `GET /api/states`. Both are false/null together when HA
                      refused the reload outright.'
                    items:
                      type: object
                      required:
                      - unique_id
                      - domain
                      - entity_id
                      - created
                      properties:
                        unique_id:
                          type: string
                        domain:
                          type: string
                        entity_id:
                          type: string
                          nullable: true
                        created:
                          type: boolean
                  reloaded:
                    type: boolean
                  reload_error:
                    type: string
                    description: "Why the reload failed: HA's HTTP status plus a bounded
                      excerpt of its response body, or the transport error class.
                      Present only when `reloaded` is false; absent otherwise."
                  reformatted:
                    type: boolean
                    description: True when the whole file had to be 
                      re-serialized instead of only this entry's lines, so 
                      formatting elsewhere in the file may have changed. Absent 
                      otherwise.
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      description: Refuses with 400 unless `configuration.yaml` has a top-level 
        `template:` key (or a labelled `template <label>:` key) that `!include`s
        a file — without it Home Assistant never reads `template.yaml` and the 
        new entry would be written and ignored. The entry is written to the file
        the include names, not to `template.yaml` by convention. Body is either 
        a bare entity item or a full block (declares any template entity domain 
        — `sensor:`, `number:`, `select:`, `button:`, `weather:`, … — optionally
        with block-level `triggers:`/`actions:`/`conditions:`); a full block is 
        how trigger-based and multi-domain entries are created. Either way the 
        entry is appended as its own new top-level list item — a bare item gets 
        a fresh state-based block for `domain` and is never merged into a 
        pre-existing block, because Home Assistant drops a whole top-level item 
        when any one entity in it fails validation, which would take the user's 
        own entities in that block down with it. A bare item carrying a 
        block-level trigger key is rejected (400).
      parameters:
      - name: domain
        in: query
        required: false
        description: domain for a bare entity item (any template entity domain; 
          default sensor); ignored for a full block
        schema:
          type: string
          default: sensor
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        required: true
    delete:
      summary: Delete template sensor
      tags:
      - templates
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: &id002
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                  reloaded:
                    type: boolean
                  reload_error:
                    type: string
                    description: "Why the reload failed: HA's HTTP status plus a bounded
                      excerpt of its response body, or the transport error class.
                      Present only when `reloaded` is false; absent otherwise."
                  reformatted:
                    type: boolean
                    description: True when the whole file had to be 
                      re-serialized instead of only this entry's lines, so 
                      formatting elsewhere in the file may have changed. Absent 
                      otherwise.
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
  /v1/config/scripts:
    get:
      summary: List all script definitions
      tags:
      - scripts
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  scripts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        alias:
                          type: string
                        mode:
                          type: string
                        fields:
                          type: array
                          items:
                            type: object
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/config/script:
    get:
      summary: Get single script definition
      tags:
      - scripts
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  content:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
    put:
      summary: Update script definition
      tags:
      - scripts
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: *id001
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          default: true
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        required: true
    post:
      summary: Create new script
      tags:
      - scripts
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                  id:
                    type: string
                  entity_id:
                    type: string
                  reloaded:
                    type: boolean
                  reload_error:
                    type: string
                    description: "Why the reload failed: HA's HTTP status plus a bounded
                      excerpt of its response body, or the transport error class.
                      Present only when `reloaded` is false; absent otherwise."
                  reformatted:
                    type: boolean
                    description: True when the whole file had to be 
                      re-serialized instead of only this entry's lines, so 
                      formatting elsewhere in the file may have changed. Absent 
                      otherwise.
                  entity_created:
                    type: boolean
                    description: Whether the entity was observed live (`GET 
                      /api/states`) after the reload — polled for up to ~2s. 
                      `false` covers both a reload HA refused and a reload HA 
                      accepted but the entity never appeared (HA validates each 
                      YAML entry and silently drops one that fails schema 
                      validation without failing the reload; the write and the 
                      reload both then report success while the entity never 
                      exists).
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      description: 'Refuses with 400 unless `configuration.yaml` has a top-level `script:`
        key (or a labelled `script <label>:` key) that `!include`s a file — without
        it Home Assistant never reads `scripts.yaml` and the new entry would be written
        and ignored. The entry is written to the file the include names, not to `scripts.yaml`
        by convention. '
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        required: true
    delete:
      summary: Delete script
      tags:
      - scripts
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: *id002
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
  /v1/config/automations:
    get:
      summary: List all automation definitions
      tags:
      - automations
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  automations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        alias:
                          type: string
                        mode:
                          type: string
                        description:
                          type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
  /v1/config/automation:
    get:
      summary: Get single automation definition
      tags:
      - automations
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  content:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
    put:
      summary: Update automation definition
      tags:
      - automations
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: *id001
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          default: true
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        required: true
    post:
      summary: Create new automation
      tags:
      - automations
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                  id:
                    type: string
                  entity_id:
                    type: string
                    nullable: true
                  reloaded:
                    type: boolean
                  reload_error:
                    type: string
                    description: "Why the reload failed: HA's HTTP status plus a bounded
                      excerpt of its response body, or the transport error class.
                      Present only when `reloaded` is false; absent otherwise."
                  reformatted:
                    type: boolean
                    description: True when the whole file had to be 
                      re-serialized instead of only this entry's lines, so 
                      formatting elsewhere in the file may have changed. Absent 
                      otherwise.
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      description: 'Refuses with 400 unless `configuration.yaml` has a top-level `automation:`
        key (or a labelled `automation <label>:` key) that `!include`s a file — without
        it Home Assistant never reads `automations.yaml` and the new entry would be
        written and ignored. The entry is written to the file the include names, not
        to `automations.yaml` by convention. '
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        required: true
    delete:
      summary: Delete automation
      tags:
      - automations
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: *id002
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
  /v1/config/helpers:
    get:
      summary: List all helpers
      tags:
      - helpers
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  helpers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        domain:
                          type: string
                        icon:
                          type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      description: "Reads every file Home Assistant reads for the domain, in its order:
        the `!include` target, the domain written out inline in `configuration.yaml`,
        each `*.yaml` under an `!include_dir_merge_named`/`!include_dir_merge_list`
        directory (walked recursively), and any package file reached through `homeassistant:
        packages:`. `!include_dir_named` and `!include_dir_list` are not resolved
        — there an entry's identity comes from the file rather than from the document
        — and the domain reads as unwired."
      parameters:
      - name: domain
        in: query
        required: false
        schema:
          type: string
  /v1/config/helper:
    get:
      summary: Get single helper definition
      tags:
      - helpers
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: 'The identifier this helper is addressed by: the
                      YAML top-level key when `source` is `yaml`, the live entity_id
                      when `source` is `storage`.'
                  domain:
                    type: string
                  content:
                    type: string
                    description: "The definition as YAML. For `source: storage` it
                      is rendered from HA's collection and carries a leading `# source:
                      storage` comment, because this content is read-only."
                  source:
                    type: string
                    enum:
                    - yaml
                    - storage
                    description: '`yaml` — defined in a helper YAML file this service
                      manages, editable via PUT/DELETE. `storage` — created in the
                      Home Assistant UI, readable here but not editable; PUT/DELETE
                      answer 409 for it.'
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      description: 'Resolves both sources: a YAML helper by its top-level key, and
        a storage-backed helper (created in the Home Assistant UI) by its entity_id,
        its collection id, or `<domain>.<collection id>`. `input_button` is readable
        here although it has no YAML form. 409 if a bare id is ambiguous across storage
        domains. The YAML search covers every wiring the listing covers, including
        a domain written out inline in `configuration.yaml` and one arriving through
        a package.'
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
    post:
      summary: Create new helper
      tags:
      - helpers
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                  id:
                    type: string
                  entity_id:
                    type: string
                  reloaded:
                    type: boolean
                  reload_error:
                    type: string
                    description: "Why the reload failed: HA's HTTP status plus a bounded
                      excerpt of its response body, or the transport error class.
                      Present only when `reloaded` is false; absent otherwise."
                  reformatted:
                    type: boolean
                    description: True when the whole file had to be 
                      re-serialized instead of only this entry's lines, so 
                      formatting elsewhere in the file may have changed. Absent 
                      otherwise.
                  entity_created:
                    type: boolean
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      description: Refuses with 400 unless `configuration.yaml` has a top-level 
        `<domain>:` key (or a labelled `<domain> <label>:` key) that `!include`s
        a file — without it Home Assistant never reads `<domain>.yaml` and the 
        new helper would be written and ignored. The helper is written to the 
        file the include names, not to `<domain>.yaml` by convention.
      parameters:
      - name: domain
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
    put:
      summary: Update helper definition
      tags:
      - helpers
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: *id002
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      description: "Edits the entry in place, wherever the read path found it. 409
        if that file keeps the helper under a key rather than at its root — a domain
        written out inline in `configuration.yaml`, or one arriving through a package:
        the entry is real and readable, and splicing a single entry is only safe at
        a document's root. The refusal names the file; `PUT /v1/config/file` writes
        it. 409 also for a storage-backed helper, which has no YAML definition to
        change."
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
      - name: domain
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
    delete:
      summary: Delete helper
      tags:
      - helpers
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: *id002
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      description: "Edits the entry in place, wherever the read path found it. 409
        if that file keeps the helper under a key rather than at its root — a domain
        written out inline in `configuration.yaml`, or one arriving through a package:
        the entry is real and readable, and splicing a single entry is only safe at
        a document's root. The refusal names the file; `PUT /v1/config/file` writes
        it. 409 also for a storage-backed helper, which has no YAML definition to
        change."
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
      - name: domain
        in: query
        required: false
        schema:
          type: string
  /v1/config/wiring:
    get:
      summary: Would a create for this domain reach a file Home Assistant reads?
      tags:
      - config
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                - domain
                - wired
                properties:
                  domain:
                    type: string
                  wired:
                    type: boolean
                    description: Whether a create for this domain can be written
                      to a file Home Assistant reads.
                  file:
                    type: string
                    description: Config-relative path a new entry would be 
                      written to. Present only when `wired`.
                  reason:
                    type: string
                    description: Why a create would be refused — byte-identical 
                      to the 400 message the create route answers with. Present 
                      only when `wired` is false.
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      description: 'The C-10 include-wiring check, exposed read-only so a client can
        preview a create without attempting it. Answers 200 either way: `wired: true`
        with the `file` a new entry would go to, or `wired: false` with the `reason`
        — the exact text the create route refuses with, so a dry run can fail with
        the same explanation as the confirmed run. Accepts the domains that have a
        create route: automation, script, template and the YAML helper domains.'
      parameters:
      - name: domain
        in: query
        required: true
        schema:
          type: string
  /v1/ha/reload/{domain}:
    post:
      summary: Reload an HA integration domain
      tags:
      - ha
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  domain:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
  /v1/ha/check-config:
