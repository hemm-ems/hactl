                    properties:
                      public_key:
                        type: string
                      endpoint:
                        type: string
                      allowed_ips:
                        type: string
                      persistent_keepalive:
                        type: integer
          text/plain:
            schema:
              type: string
        required: true
  /v1/wireguard/start:
    post:
      summary: Start a WireGuard tunnel
      tags:
      - wireguard
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  tunnel:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: tunnel
        in: query
        required: false
        schema:
          type: string
          default: wg0
  /v1/wireguard/stop:
    post:
      summary: Stop a WireGuard tunnel
      tags:
      - wireguard
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  tunnel:
                    type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: tunnel
        in: query
        required: false
        schema:
          type: string
          default: wg0
  /v1/wireguard/status:
    get:
      summary: Get WireGuard tunnel status
      tags:
      - wireguard
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  tunnel:
                    type: string
                  state:
                    type: string
                    enum:
                    - active
                    - inactive
                  interface:
                    type: object
                    properties:
                      public_key:
                        type: string
                      listening_port:
                        type: integer
                  peers:
                    type: array
                    items:
                      type: object
                      properties:
                        public_key:
                          type: string
                        endpoint:
                          type: string
                        allowed_ips:
                          type: string
                        latest_handshake:
                          type: string
                        latest_handshake_secs:
                          type: integer
                          nullable: true
                        transfer_rx:
                          type: string
                        transfer_tx:
                          type: string
                        transfer_rx_bytes:
                          type: integer
                        transfer_tx_bytes:
                          type: integer
                  monitor:
                    type: object
                    description: Live dyndns re-resolution monitor state.
                    properties:
                      running:
                        type: boolean
                      hostnames:
                        type: array
                        items:
                          type: string
                      healthy:
                        type: boolean
                      resolved:
                        type: object
                        additionalProperties:
                          type: string
                      last_check_secs_ago:
                        type: integer
                        nullable: true
                      last_reresolve_secs_ago:
                        type: integer
                        nullable: true
                      attempt:
                        type: integer
                      next_retry_secs:
                        type: integer
                        nullable: true
                      last_error:
                        type: string
                        nullable: true
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: tunnel
        in: query
        required: false
        schema:
          type: string
          default: wg0
  /v1/logs:
    get:
      summary: Query recent companion log records from the in-memory ring buffer
      tags:
      - logs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        ts:
                          type: number
                        level:
                          type: string
                        name:
                          type: string
                        message:
                          type: string
        4XX:
          $ref: '#/components/responses/Error'
        5XX:
          $ref: '#/components/responses/Error'
      parameters:
      - name: component
        in: query
        required: false
        schema:
          type: string
      - name: level
        in: query
        required: false
        schema:
          type: string
      - name: since
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: integer
              description: HTTP status code
            message:
              type: string
  responses:
    Error:
      description: Error response (JSON envelope)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
- bearerAuth: []
